name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned
        run: |
          xcodebuild -project "SUMEE!.xcodeproj" -scheme "SUMEE!" \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
      - name: Show errors
        if: failure()
        run: grep -E "error:|BUILD FAILED" build.log | head -40
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r SUMEE.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SUMEE-ipa
          path: SUMEE.ipa
