name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fix glassEffect syntax
        run: |
          python3 -c '
          files = [
              "sumee/Views/Backgrounds/BubbleBackground.swift",
              "sumee/Views/Core/HeaderView.swift"
          ]
          for path in files:
              with open(path, "r") as f:
                  content = f.read()
              # Replace the multi-line modifier block cleanly
              content = content.replace(".glassEffect(\n        .regular\n    )", ".background(.ultraThinMaterial)")
              content = content.replace(".glassEffect(.regular)", ".background(.ultraThinMaterial)")
              with open(path, "w") as f:
                  f.write(content)
          '
      - name: Build unsigned
        run: |
          xcodebuild -project "SUMEE!.xcodeproj" -scheme "SUMEE!" \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r SUMEE.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SUMEE-ipa
          path: SUMEE.ipa
