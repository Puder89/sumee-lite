name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Patch incompatible modifiers
        run: |
          python3 -c '
          import glob
          for filepath in glob.glob("sumee/**/*.swift", recursive=True):
              with open(filepath, "r") as f:
                  content = f.read()
              if "glassEffect" in content:
                  lines = content.splitlines()
                  new_lines = [l for l in lines if "glassEffect" not in l and ".regular" not in l]
                  with open(filepath, "w") as f:
                      f.write("\n".join(new_lines))
          '
      - name: Build unsigned
        run: |
          xcodebuild -project "SUMEE!.xcodeproj" -scheme "SUMEE!" \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r SUMEE.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SUMEE-ipa
          path: SUMEE.ipa
